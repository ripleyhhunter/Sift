    keywords: ["travel", "flight", "hotel", "booking", "itinerary", "vacation", "trip"]

  - name: "Receipts"
    subcategories:
      - "Shopping"
      - "Services"
      - "Utilities"
    keywords: ["receipt", "purchase", "order", "confirmation"]

  - name: "Miscellaneous"
    subcategories: []
