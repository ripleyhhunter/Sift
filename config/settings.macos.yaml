# Behavior Settings
behavior:
  create_missing_folders: true
  preserve_original_filename: true
  add_date_prefix: false
  duplicate_handling: "rename"
  move_or_copy: "move"
  enable_subcategory_classification: true
  confidence_threshold: 0.7
  manual_review_folder: "Needs_Review"

# Logging
logging:
  level: "INFO"
  log_file: "logs/smart_folder.log"
  max_log_size_mb: 10
  backup_count: 5

# Dashboard Settings
dashboard:
  enabled: true
  port: 5000
  auto_open_browser: true

# Advanced Settings
advanced:
  retry_attempts: 3
  retry_delay_seconds: 5
  concurrent_processing: false
  startup_scan: true

