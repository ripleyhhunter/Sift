      - "Transcripts"
      - "Certificates"
      - "Applications"
    keywords: ["education", "school", "university", "degree", "transcript", "diploma"]

  - name: "Personal"
    subcategories:
      - "Identity"
      - "Certificates"
      - "Correspondence"
      - "Fashion"
      - "Lifestyle"
    keywords: ["personal", "birth", "marriage", "certificate", "wardrobe", "clothing"]

  - name: "Home"
    subcategories:
      - "Kitchen"
      - "Inventory"
      - "Maintenance"
      - "Furniture"
      - "Appliances"
      - "Recipes"
    keywords: ["home", "kitchen", "inventory", "household", "furniture", "appliance", "recipe"]

  - name: "Health_Fitness"
    subcategories:
      - "Exercise_Programs"
      - "Race_Registrations"
      - "Gym_Memberships"
      - "Nutrition"
    keywords: ["fitness", "exercise", "workout", "training program", "marathon", "running", "gym"]

  - name: "Hobbies"
    subcategories:
      - "Sports"
      - "Crafts"
