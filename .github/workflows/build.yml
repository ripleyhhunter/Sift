name: Build Sift

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      shell: pwsh
      run: |
        pyinstaller --name Sift --onedir --console --hidden-import watchdog.observers --hidden-import watchdog.events --hidden-import rapidfuzz --hidden-import yaml --hidden-import pypdf --hidden-import openpyxl --hidden-import pystray src/main.py
    
    - name: Package distribution
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist\Sift_Package\Sift
        Copy-Item -Recurse dist\Sift\* dist\Sift_Package\Sift\
        New-Item -ItemType Directory -Force -Path dist\Sift_Package\Sift\config
        Copy-Item config\settings.default.yaml dist\Sift_Package\Sift\config\
        Copy-Item config\settings.default.yaml dist\Sift_Package\Sift\config\settings.yaml
        New-Item -ItemType Directory -Force -Path dist\Sift_Package\Sift\logs
        New-Item -ItemType Directory -Force -Path dist\Sift_Package\Sift\temp
        New-Item -ItemType Directory -Force -Path dist\Sift_Package\Sift\data
        Copy-Item README.md dist\Sift_Package\
        if (Test-Path SETUP_INSTRUCTIONS.md) { Copy-Item SETUP_INSTRUCTIONS.md dist\Sift_Package\ }
        '@echo off`r`ncd /d "%~dp0Sift"`r`nSift.exe %*`r`npause' | Out-File -FilePath dist\Sift_Package\run_sift.bat -Encoding ascii
    
    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path dist\Sift_Package\* -DestinationPath dist\Sift_Windows.zip
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sift-Windows
        path: dist/Sift_Windows.zip

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        brew install poppler libmagic
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-macos.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --name Sift --onedir --console --hidden-import watchdog.observers --hidden-import watchdog.events --hidden-import rapidfuzz --hidden-import yaml --hidden-import pypdf --hidden-import openpyxl --hidden-import pystray --hidden-import pync src/main.py
    
    - name: Package distribution
      run: |
        mkdir -p dist/Sift_Package/Sift
        cp -R dist/Sift/* dist/Sift_Package/Sift/
        mkdir -p dist/Sift_Package/Sift/config
        cp config/settings.default.yaml dist/Sift_Package/Sift/config/
        cp config/settings.macos.yaml dist/Sift_Package/Sift/config/
        sed "s/{username}/\$USER/g" config/settings.macos.yaml > dist/Sift_Package/Sift/config/settings.yaml
        mkdir -p dist/Sift_Package/Sift/logs
        mkdir -p dist/Sift_Package/Sift/temp
        mkdir -p dist/Sift_Package/Sift/data
        cp README.md dist/Sift_Package/
        cp SETUP_INSTRUCTIONS_MACOS.md dist/Sift_Package/ || true
        echo '#!/bin/bash' > dist/Sift_Package/run_sift.sh
        echo 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' >> dist/Sift_Package/run_sift.sh
        echo 'cd "$SCRIPT_DIR/Sift"' >> dist/Sift_Package/run_sift.sh
        echo './Sift "$@"' >> dist/Sift_Package/run_sift.sh
        chmod +x dist/Sift_Package/run_sift.sh
        echo '#!/bin/bash' > dist/Sift_Package/install_dependencies.sh
        echo 'echo "Installing dependencies for Sift..."' >> dist/Sift_Package/install_dependencies.sh
        echo 'if ! command -v brew &> /dev/null; then' >> dist/Sift_Package/install_dependencies.sh
        echo '    echo "Please install Homebrew first: https://brew.sh"' >> dist/Sift_Package/install_dependencies.sh
        echo '    exit 1' >> dist/Sift_Package/install_dependencies.sh
        echo 'fi' >> dist/Sift_Package/install_dependencies.sh
        echo 'brew install poppler' >> dist/Sift_Package/install_dependencies.sh
        echo 'echo "Done! You can now run ./run_sift.sh"' >> dist/Sift_Package/install_dependencies.sh
        chmod +x dist/Sift_Package/install_dependencies.sh
    
    - name: Create ZIP archive
      run: |
        cd dist && zip -r Sift_macOS.zip Sift_Package
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sift-macOS
        path: dist/Sift_macOS.zip

  build-source:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create source distribution
      run: |
        mkdir -p dist/Sift_Source
        cp -r src dist/Sift_Source/
        cp -r config dist/Sift_Source/
        cp requirements.txt dist/Sift_Source/
        cp requirements-macos.txt dist/Sift_Source/ || true
        cp setup_macos.sh dist/Sift_Source/ || true
        cp README.md dist/Sift_Source/
        cp SETUP_INSTRUCTIONS_MACOS.md dist/Sift_Source/ || true
        mkdir -p dist/Sift_Source/logs
        mkdir -p dist/Sift_Source/temp
        mkdir -p dist/Sift_Source/data
        cd dist && zip -r Sift_Source.zip Sift_Source
    
    - name: Upload source artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sift-Source
        path: dist/Sift_Source.zip

  release:
    needs: [build-windows, build-macos, build-source]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/Sift-Windows/Sift_Windows.zip
          artifacts/Sift-macOS/Sift_macOS.zip
          artifacts/Sift-Source/Sift_Source.zip
        generate_release_notes: true
        draft: false
        prerelease: false
