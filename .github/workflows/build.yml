name: Build SmartFolder

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      shell: pwsh
      run: |
        pyinstaller --name SmartFolder --onedir --console --hidden-import watchdog.observers --hidden-import watchdog.events --hidden-import rapidfuzz --hidden-import yaml --hidden-import pypdf --hidden-import openpyxl --hidden-import pystray src/main.py
    
    - name: Package distribution
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist\SmartFolder_Package\SmartFolder
        Copy-Item -Recurse dist\SmartFolder\* dist\SmartFolder_Package\SmartFolder\
        New-Item -ItemType Directory -Force -Path dist\SmartFolder_Package\SmartFolder\config
        Copy-Item config\settings.default.yaml dist\SmartFolder_Package\SmartFolder\config\
        Copy-Item config\settings.default.yaml dist\SmartFolder_Package\SmartFolder\config\settings.yaml
        New-Item -ItemType Directory -Force -Path dist\SmartFolder_Package\SmartFolder\logs
        New-Item -ItemType Directory -Force -Path dist\SmartFolder_Package\SmartFolder\temp
        New-Item -ItemType Directory -Force -Path dist\SmartFolder_Package\SmartFolder\data
        Copy-Item README.md dist\SmartFolder_Package\
        if (Test-Path SETUP_INSTRUCTIONS.md) { Copy-Item SETUP_INSTRUCTIONS.md dist\SmartFolder_Package\ }
        '@echo off`r`ncd /d "%~dp0SmartFolder"`r`nSmartFolder.exe %*`r`npause' | Out-File -FilePath dist\SmartFolder_Package\run_smartfolder.bat -Encoding ascii
    
    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path dist\SmartFolder_Package\* -DestinationPath dist\SmartFolder_Windows.zip
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartFolder-Windows
        path: dist/SmartFolder_Windows.zip

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        brew install poppler libmagic
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-macos.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --name SmartFolder --onedir --console --hidden-import watchdog.observers --hidden-import watchdog.events --hidden-import rapidfuzz --hidden-import yaml --hidden-import pypdf --hidden-import openpyxl --hidden-import pystray --hidden-import pync src/main.py
    
    - name: Package distribution
      run: |
        mkdir -p dist/SmartFolder_Package/SmartFolder
        cp -R dist/SmartFolder/* dist/SmartFolder_Package/SmartFolder/
        mkdir -p dist/SmartFolder_Package/SmartFolder/config
        cp config/settings.default.yaml dist/SmartFolder_Package/SmartFolder/config/
        cp config/settings.macos.yaml dist/SmartFolder_Package/SmartFolder/config/
        sed "s/{username}/\$USER/g" config/settings.macos.yaml > dist/SmartFolder_Package/SmartFolder/config/settings.yaml
        mkdir -p dist/SmartFolder_Package/SmartFolder/logs
        mkdir -p dist/SmartFolder_Package/SmartFolder/temp
        mkdir -p dist/SmartFolder_Package/SmartFolder/data
        cp README.md dist/SmartFolder_Package/
        cp SETUP_INSTRUCTIONS_MACOS.md dist/SmartFolder_Package/ || true
        echo '#!/bin/bash' > dist/SmartFolder_Package/run_smartfolder.sh
        echo 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' >> dist/SmartFolder_Package/run_smartfolder.sh
        echo 'cd "$SCRIPT_DIR/SmartFolder"' >> dist/SmartFolder_Package/run_smartfolder.sh
        echo './SmartFolder "$@"' >> dist/SmartFolder_Package/run_smartfolder.sh
        chmod +x dist/SmartFolder_Package/run_smartfolder.sh
        echo '#!/bin/bash' > dist/SmartFolder_Package/install_dependencies.sh
        echo 'echo "Installing dependencies for SmartFolder..."' >> dist/SmartFolder_Package/install_dependencies.sh
        echo 'if ! command -v brew &> /dev/null; then' >> dist/SmartFolder_Package/install_dependencies.sh
        echo '    echo "Please install Homebrew first: https://brew.sh"' >> dist/SmartFolder_Package/install_dependencies.sh
        echo '    exit 1' >> dist/SmartFolder_Package/install_dependencies.sh
        echo 'fi' >> dist/SmartFolder_Package/install_dependencies.sh
        echo 'brew install poppler' >> dist/SmartFolder_Package/install_dependencies.sh
        echo 'echo "Done! You can now run ./run_smartfolder.sh"' >> dist/SmartFolder_Package/install_dependencies.sh
        chmod +x dist/SmartFolder_Package/install_dependencies.sh
    
    - name: Create ZIP archive
      run: |
        cd dist && zip -r SmartFolder_macOS.zip SmartFolder_Package
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartFolder-macOS
        path: dist/SmartFolder_macOS.zip

  build-source:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create source distribution
      run: |
        mkdir -p dist/SmartFolder_Source
        cp -r src dist/SmartFolder_Source/
        cp -r config dist/SmartFolder_Source/
        cp requirements.txt dist/SmartFolder_Source/
        cp requirements-macos.txt dist/SmartFolder_Source/ || true
        cp setup_macos.sh dist/SmartFolder_Source/ || true
        cp README.md dist/SmartFolder_Source/
        cp SETUP_INSTRUCTIONS_MACOS.md dist/SmartFolder_Source/ || true
        mkdir -p dist/SmartFolder_Source/logs
        mkdir -p dist/SmartFolder_Source/temp
        mkdir -p dist/SmartFolder_Source/data
        cd dist && zip -r SmartFolder_Source.zip SmartFolder_Source
    
    - name: Upload source artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartFolder-Source
        path: dist/SmartFolder_Source.zip

  release:
    needs: [build-windows, build-macos, build-source]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/SmartFolder-Windows/SmartFolder_Windows.zip
          artifacts/SmartFolder-macOS/SmartFolder_macOS.zip
          artifacts/SmartFolder-Source/SmartFolder_Source.zip
        generate_release_notes: true
        draft: false
        prerelease: false
